<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>资格自测 · 上海落户</title>
<style>
  :root{
    --paper:#faf8f5;--card:#fff;--ink:#1a1a18;--ink2:#57534e;--ink3:#8a857e;
    --line:#e6e1d8;--line2:#d5cec3;
    --accent:#1f5f57;--accent-soft:#ecf3f1;--accent-line:#bcd4ce;
    --ok:#1f6b45;--ok-soft:#eaf5ef;--ok-line:#bfdccd;
    --no:#8a857e;--no-soft:#f4f1eb;--no-line:#ddd6ca;
    --warn:#8a5a1a;--warn-soft:#fdf6e7;--warn-line:#e8d5a8;
    --radius:12px;
    --serif:"Noto Serif SC","Songti SC","SimSun",serif;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
       line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  .wrap{width:100%;max-width:820px;margin:0 auto;padding:48px 24px 40px;flex:1}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
  .brand{display:flex;align-items:center;gap:10px}
  .mark{width:26px;height:26px;border:1.5px solid var(--accent);border-radius:7px;
        display:grid;place-items:center;font-family:var(--serif);font-size:14px;color:var(--accent);font-weight:600}
  .brand-text{font-size:13px;color:var(--ink2);letter-spacing:.06em}
  .back{font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--accent-line);
        border-radius:8px;padding:6px 14px}
  .back:hover{background:var(--accent-soft)}

  h1{font-family:var(--serif);font-size:32px;line-height:1.3;margin:0 0 10px;letter-spacing:-.01em}
  .lede{margin:0 0 28px;color:var(--ink2);font-size:15px;max-width:56ch}

  form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}
  .field label{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:6px;font-weight:600;letter-spacing:.02em}
  .field input[type=number],.field select{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
    font-size:14.5px;font-family:inherit;color:var(--ink);background:#fff;outline:0}
  .field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .checks{display:flex;flex-wrap:wrap;gap:18px;margin-top:18px;padding-top:18px;border-top:1px dashed var(--line)}
  .checks label{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink2);cursor:pointer}
  .checks input{width:15px;height:15px;accent-color:var(--accent)}
  .submit-row{margin-top:22px;display:flex;align-items:center;gap:14px}
  button.go{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 28px;
            font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
  button.go:hover{opacity:.9}
  .hint{font-size:12px;color:var(--ink3)}

  #out{margin-top:30px}
  /* ── 总结卡：先给答案，再给依据 ── */
  .summary{border:1px solid;border-radius:var(--radius);padding:24px 28px;margin-bottom:18px}
  .summary.ok{background:var(--ok-soft);border-color:var(--ok-line)}
  .summary.warn{background:var(--warn-soft);border-color:var(--warn-line)}
  .summary.no{background:var(--no-soft);border-color:var(--no-line)}
  .s-kicker{font-size:11.5px;letter-spacing:.14em;font-weight:700;margin-bottom:10px}
  .summary.ok .s-kicker{color:var(--ok)}
  .summary.warn .s-kicker{color:var(--warn)}
  .summary.no .s-kicker{color:var(--no)}
  .s-head{font-family:var(--serif);font-size:23px;line-height:1.45;font-weight:700;margin:0 0 8px}
  .s-detail{font-size:14.5px;color:var(--ink2);margin:0}
  .s-gaps{margin:14px 0 0;padding:0;list-style:none}
  .s-gaps li{position:relative;padding-left:20px;font-size:14px;color:var(--ink2);margin-bottom:6px}
  .s-gaps li::before{content:"—";position:absolute;left:0;color:var(--ink3)}
  .s-sug{margin:14px 0 0;font-size:13px;color:var(--ink3);line-height:1.7}

  .vcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
         padding:22px 26px;margin-bottom:14px}
  .vcard.ok{border-left:3px solid var(--ok)}
  .vcard.no{border-left:3px solid var(--no-line)}
  .vcard.warn{border-left:3px solid var(--warn-line)}
  .vhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;letter-spacing:.04em}
  .badge.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
  .badge.no{background:var(--no-soft);color:var(--no);border:1px solid var(--no-line)}
  .badge.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line)}
  .vname{font-family:var(--serif);font-size:18px;font-weight:700}
  .score{margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--accent);font-weight:600}

  ul.chk{list-style:none;margin:0 0 4px;padding:0}
  ul.chk li{position:relative;padding-left:24px;margin-bottom:7px;font-size:14px;color:var(--ink2)}
  ul.chk li .ic{position:absolute;left:0;top:1px;width:16px;height:16px;border-radius:50%;
                display:grid;place-items:center;font-size:10px;font-weight:700}
  .ic.m{background:var(--ok-soft);color:var(--ok)}
  .ic.x{background:var(--no-soft);color:var(--no)}
  .ic.u{background:var(--warn-soft);color:var(--warn)}
  .ic.s{background:var(--accent-soft);color:var(--accent)}
  ul.chk li .d{color:var(--ink3);font-size:12.5px;margin-left:6px}

  .dep{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .dep .h{font-size:11.5px;letter-spacing:.08em;color:var(--ink3);font-weight:600;margin-bottom:8px}
  .dep button{display:block;width:100%;text-align:left;background:transparent;border:0;
              border-left:2px solid var(--accent-line);padding:2px 0 2px 12px;margin-bottom:10px;
              cursor:pointer;font-family:inherit;font-size:13px;color:var(--ink2)}
  .dep button:hover{border-left-color:var(--accent);color:var(--accent)}
  .note{font-size:12.5px;color:var(--ink3);margin-top:10px;line-height:1.65}

  .empty{color:var(--ink3);font-size:14px;text-align:center;padding:40px 0}

  #scrim{position:fixed;inset:0;background:rgba(26,26,24,.28);opacity:0;pointer-events:none;
         transition:opacity .2s;z-index:40}
  #scrim.open{opacity:1;pointer-events:auto}
  #drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,92vw);background:var(--card);
          border-left:1px solid var(--line);z-index:50;transform:translateX(100%);
          transition:transform .26s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
  #drawer.open{transform:translateX(0)}
  .dhead{padding:22px 26px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
  .dhead h2{font-family:var(--serif);font-size:17px;margin:0 0 4px;line-height:1.45}
  .dsub{font-size:12.5px;color:var(--ink3);font-family:var(--mono)}
  .close{background:transparent;border:0;font-size:22px;line-height:1;color:var(--ink3);cursor:pointer}
  .dbody{overflow-y:auto;padding:22px 26px 40px;flex:1;font-size:14px;color:var(--ink2);white-space:pre-wrap}

  .foot{max-width:820px;margin:0 auto;padding:0 24px 40px;font-size:11.5px;color:var(--ink3);line-height:1.8}
  .foot strong{color:var(--ink2);font-weight:600}
  @media (max-width:680px){
    .wrap{padding:28px 16px}
    h1{font-size:25px}
    .grid{grid-template-columns:1fr}
    form,.vcard{padding:20px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="mark">沪</div>
      <div class="brand-text">上海人才与就业政策 · 资格自测</div>
    </div>
    <a class="back" href="/">← 返回问答</a>
  </div>

  <h1>我能落户吗</h1>
  <p class="lede">
    填一张表，先给你一句结论——能不能申请、差哪几项；再看三条落户路径的逐条依据。
    每条都标注原文条款，判断不了的地方会明说「无法判断」，不猜。
  </p>

  <form id="form">
    <div class="grid">
      <div class="field">
        <label>最高学历</label>
        <select name="degree">
          <option value="博士">博士</option>
          <option value="硕士">硕士</option>
          <option value="本科" selected>本科</option>
          <option value="大专">大专</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="field">
        <label>是否已取得学位证</label>
        <select name="has_degree_cert">
          <option value="true" selected>是（双证齐全）</option>
          <option value="false">否（只有毕业证）</option>
        </select>
      </div>
      <div class="field">
        <label>毕业年份</label>
        <input type="number" name="grad_year" min="1990" max="2035" placeholder="如 2024">
      </div>
      <div class="field">
        <label>专业技术职称 / 技能等级</label>
        <select name="title">
          <option value="无" selected>无</option>
          <option value="初级">初级</option>
          <option value="中级">中级职称</option>
          <option value="技师">技师（二级）</option>
          <option value="副高">副高级</option>
          <option value="高级技师">高级技师（一级）</option>
          <option value="正高">正高级</option>
        </select>
      </div>
      <div class="field">
        <label>社保累计缴纳（月）</label>
        <input type="number" name="social_months" min="0" max="600" value="0">
      </div>
      <div class="field">
        <label>《上海市居住证》持有（年）</label>
        <input type="number" name="resident_years" min="0" max="60" step="0.5" value="0">
      </div>
      <div class="field">
        <label>用人单位性质</label>
        <select name="employer">
          <option value="一般企业" selected>一般企业</option>
          <option value="重点机构">重点机构 / 高新技术企业</option>
          <option value="事业单位">事业单位 / 机关 / 国企</option>
          <option value="暂无">暂无（在读或待业）</option>
        </select>
      </div>
      <div class="field">
        <label>年龄</label>
        <input type="number" name="age" min="16" max="80" value="25">
      </div>
    </div>

    <div class="checks">
      <label><input type="checkbox" name="tax_paid" checked> 持证期间依法缴纳个税</label>
      <label><input type="checkbox" name="is_shanghai_school"> 上海高校毕业</label>
    </div>

    <div class="submit-row">
      <button class="go" type="submit">开始判定</button>
      <span class="hint">全部在浏览器本地填写，不会上传除判据外的信息</span>
    </div>
  </form>

  <div id="out"><div class="empty">填好上面的信息，点「开始判定」</div></div>
</div>

<div class="foot">
  <strong>非官方工具</strong> · 本页为个人学习作品，与上海市人力资源和社会保障局无隶属关系。
  判定依据公开政策文件，只覆盖基础条件，不含加分/减分项与激励条款；结果仅供参考，不构成办事依据，
  请以官方口径与单位人事意见为准。
</div>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <div class="dhead">
    <div><h2 id="dt">条款原文</h2><div class="dsub" id="ds"></div></div>
    <button class="close" id="dc" aria-label="关闭">×</button>
  </div>
  <div class="dbody" id="db"></div>
</aside>

<script>
const $ = s => document.querySelector(s);
const out = $("#out");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ICON = { "满足": ["m","✓"], "不满足": ["x","✗"], "无法判断": ["u","?"], "计分": ["s","·"] };
const BADGE = { "符合": "ok", "不符合": "no", "待确认": "warn" };

function verdictCard(v){
  const cls = BADGE[v.result] || "no";
  const score = v.extra && v.extra.score != null ? `<span class="score">${v.extra.score} 分</span>` : "";
  const checks = v.checks.map(c => {
    const [k, ic] = ICON[c.state] || ["s","·"];
    const d = c.detail ? `<span class="d">${esc(c.detail)}</span>` : "";
    return `<li><span class="ic ${k}">${ic}</span>${esc(c.label)}${d}</li>`;
  }).join("");
  const deps = v.citations.length ? `
    <div class="dep">
      <div class="h">依据条款 · 点击查看原文</div>
      ${v.citations.map(c => `<button data-cid="${c.clause_id}">
        <b>${esc(c.clause_no || "")}</b> 《${esc(c.doc_title)}》
      </button>`).join("")}
    </div>` : "";
  const note = v.note ? `<div class="note">${esc(v.note)}</div>` : "";
  return `<div class="vcard ${cls}">
    <div class="vhead">
      <span class="badge ${cls}">${esc(v.result)}</span>
      <span class="vname">${esc(v.name)}</span>
      ${v.key === "points" ? '<span class="badge no" style="font-weight:600">非落户路径</span>' : ""}
      ${score}
    </div>
    <ul class="chk">${checks}</ul>
    ${deps}${note}
  </div>`;
}

function summaryCard(s){
  const cls = s.verdict === "可以申请" ? "ok" : (s.verdict === "可能有戏" ? "warn" : "no");
  const gaps = (s.gaps && s.gaps.length)
    ? `<ul class="s-gaps">${s.gaps.map(g => `<li>${esc(g)}</li>`).join("")}</ul>` : "";
  const sug = (s.suggestions && s.suggestions.length)
    ? `<div class="s-sug">${s.suggestions.map(esc).join("<br>")}</div>` : "";
  const pn = s.points_note ? `<div class="s-sug" style="border-top:1px dashed var(--line);padding-top:10px;margin-top:14px">${esc(s.points_note)}</div>` : "";
  return `<div class="summary ${cls}">
    <div class="s-kicker">结论 · ${esc(s.verdict)}</div>
    <p class="s-head">${esc(s.headline)}</p>
    <p class="s-detail">${esc(s.detail)}</p>
    ${gaps}${sug}${pn}
  </div>`;
}

function render(d){
  out.innerHTML = summaryCard(d.summary) + d.verdicts.map(verdictCard).join("");
}

function formData(){
  const f = new FormData($("#form"));
  const gy = f.get("grad_year");
  return {
    degree: f.get("degree"),
    has_degree_cert: f.get("has_degree_cert") === "true",
    grad_year: gy ? parseInt(gy, 10) : null,
    is_shanghai_school: f.get("is_shanghai_school") === "on",
    social_months: parseInt(f.get("social_months") || "0", 10),
    resident_years: parseFloat(f.get("resident_years") || "0"),
    title: f.get("title"),
    tax_paid: f.get("tax_paid") === "on",
    employer: f.get("employer"),
    age: parseInt(f.get("age") || "25", 10),
  };
}

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $(".go");
  btn.disabled = true; btn.textContent = "判定中";
  try{
    const r = await fetch("/api/eligibility", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(formData())
    });
    if (!r.ok){ out.innerHTML = `<div class="empty">接口返回 ${r.status}</div>`; return; }
    render(await r.json());
  }catch(err){
    out.innerHTML = `<div class="empty">网络错误：${esc(err.message)}</div>`;
  }finally{
    btn.disabled = false; btn.textContent = "开始判定";
  }
});

/* 抽屉 */
async function openClause(id){
  $("#scrim").classList.add("open");
  $("#drawer").classList.add("open");
  $("#dt").textContent = "加载中…"; $("#ds").textContent = ""; $("#db").textContent = "";
  try{
    const r = await fetch(`/api/clause/${id}`);
    if(!r.ok) throw new Error("读取失败 " + r.status);
    const d = await r.json();
    $("#dt").textContent = d.doc_title;
    $("#ds").textContent = [d.doc_no, d.clause_no, d.effective_from ? "生效 " + d.effective_from : ""].filter(Boolean).join(" · ");
    $("#db").textContent = d.content + (d.source_url ? "\n\n" + d.source_url : "");
  }catch(e){ $("#dt").textContent = "读取失败"; $("#db").textContent = e.message; }
}
function closeDrawer(){
  $("#scrim").classList.remove("open");
  $("#drawer").classList.remove("open");
}
out.addEventListener("click", e => {
  const b = e.target.closest("[data-cid]");
  if (b) openClause(b.dataset.cid);
});
$("#dc").addEventListener("click", closeDrawer);
$("#scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

/* ── 演示预设：/check.html?preset=phd ──
   方便演示和分享，也方便截图验收 */
const PRESETS = {
  phd: { degree:"博士", has_degree_cert:true, grad_year:2026, social_months:6,
         resident_years:0.5, title:"无", employer:"一般企业", age:28,
         tax_paid:true, is_shanghai_school:false },
  worker: { degree:"本科", has_degree_cert:true, grad_year:2022, social_months:48,
            resident_years:4, title:"无", employer:"一般企业", age:26,
            tax_paid:true, is_shanghai_school:false },
  senior: { degree:"本科", has_degree_cert:true, grad_year:2013, social_months:96,
            resident_years:8, title:"中级", employer:"一般企业", age:35,
            tax_paid:true, is_shanghai_school:false }
};

(function(){
  const key = new URLSearchParams(location.search).get("preset");
  const p = PRESETS[key];
  if (!p) return;
  const f = $("#form");
  f.degree.value = p.degree;
  f.has_degree_cert.value = String(p.has_degree_cert);
  f.grad_year.value = p.grad_year;
  f.title.value = p.title;
  f.social_months.value = p.social_months;
  f.resident_years.value = p.resident_years;
  f.employer.value = p.employer;
  f.age.value = p.age;
  f.tax_paid.checked = p.tax_paid;
  f.is_shanghai_school.checked = p.is_shanghai_school;
  f.dispatchEvent(new Event("submit", { cancelable: true }));
})();
</script>
</body>
</html>
