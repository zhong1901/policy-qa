<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>政策问答 · 上海人社</title>
<style>
  :root{
    --paper:#faf8f5; --card:#ffffff; --ink:#1a1a18; --ink2:#57534e; --ink3:#8a857e;
    --line:#e6e1d8; --line2:#d5cec3;
    --accent:#1f5f57; --accent-soft:#ecf3f1; --accent-line:#bcd4ce;
    --warn:#8a5a1a; --warn-soft:#fdf6e7; --warn-line:#e8d5a8;
    --radius:12px;
    --serif:"Noto Serif SC","Songti SC","SimSun",serif;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    line-height:1.7; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  .wrap{width:100%; max-width:800px; margin:0 auto; padding:56px 24px 40px; flex:1}

  /* ── 品牌行 ── */
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:36px}
  .brand-mark{
    width:26px;height:26px;border:1.5px solid var(--accent);border-radius:7px;
    display:grid;place-items:center;font-family:var(--serif);font-size:14px;
    color:var(--accent);font-weight:600;
  }
  .brand-text{font-size:13px;color:var(--ink2);letter-spacing:.06em}

  /* ── 首屏标题区 ── */
  h1{
    font-family:var(--serif); font-size:38px; line-height:1.25; font-weight:700;
    margin:0 0 14px; letter-spacing:-.01em;
  }
  .lede{margin:0 0 34px; color:var(--ink2); font-size:15.5px; max-width:56ch}
  .lede b{color:var(--ink); font-weight:600}

  /* ── 提问区：主动作 ── */
  .ask{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:6px; transition:border-color .15s, box-shadow .15s;
  }
  .ask:focus-within{border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{
    width:100%; border:0; outline:0; resize:none; background:transparent;
    font-family:var(--sans); font-size:16px; line-height:1.6; color:var(--ink);
    padding:14px 14px 6px; min-height:56px;
  }
  textarea::placeholder{color:var(--ink3)}
  .ask-row{display:flex; align-items:center; justify-content:space-between; padding:0 10px 10px}
  .hint{font-size:12px;color:var(--ink3)}
  kbd{
    font-family:var(--mono);font-size:11px;border:1px solid var(--line2);
    border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink2);
  }
  button.send{
    background:var(--accent); color:#fff; border:0; border-radius:8px;
    padding:9px 22px; font-size:14.5px; font-weight:600; font-family:var(--sans);
    cursor:pointer; transition:opacity .15s, transform .06s;
  }
  button.send:hover{opacity:.9}
  button.send:active{transform:translateY(1px)}
  button.send:disabled{opacity:.45; cursor:default}

  /* ── 示例问题 ── */
  .examples{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 0}
  .chip{
    border:1px solid var(--line); background:transparent; color:var(--ink2);
    border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer;
    font-family:var(--sans); transition:all .15s;
  }
  .chip:hover{border-color:var(--accent-line); color:var(--accent); background:var(--accent-soft)}

  /* ── 答案区 ── */
  #out{margin-top:34px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:28px 30px; margin-bottom:16px;
  }
  .card.refused{background:var(--warn-soft); border-color:var(--warn-line)}
  .card.conflict{background:#fdf2f2; border-color:#e7c4c4}

  .eyebrow{
    font-size:11.5px; letter-spacing:.12em; color:var(--ink3);
    text-transform:uppercase; margin-bottom:12px; font-weight:600;
  }
  .conclusion{
    font-family:var(--serif); font-size:21px; line-height:1.6; font-weight:600;
    margin:0 0 4px; letter-spacing:-.005em;
  }
  .conclusion .cite-inline{
    font-family:var(--mono); font-size:11px; vertical-align:super; line-height:0;
    background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line);
    border-radius:4px; padding:1px 4px; cursor:pointer; margin-left:2px;
  }
  .conclusion .cite-inline:hover{background:var(--accent); color:#fff}

  section.block{margin-top:26px; padding-top:22px; border-top:1px solid var(--line)}
  section.block:first-of-type{margin-top:22px}
  .block h3{
    font-size:12px; letter-spacing:.1em; color:var(--ink3); font-weight:600;
    margin:0 0 12px; text-transform:uppercase;
  }
  ul.plain, ol.plain{margin:0; padding-left:0; list-style:none}
  ul.plain li{
    position:relative; padding-left:18px; margin-bottom:9px; font-size:15px;
  }
  ul.plain li::before{
    content:""; position:absolute; left:2px; top:11px;
    width:5px; height:5px; border-radius:50%; background:var(--accent-line);
  }
  ol.plain{counter-reset:step}
  ol.plain li{
    position:relative; padding-left:26px; margin-bottom:9px; font-size:15px;
    counter-increment:step;
  }
  ol.plain li::before{
    content:counter(step); position:absolute; left:0; top:2px;
    width:17px;height:17px;border-radius:50%;background:var(--accent-soft);
    color:var(--accent); font-size:11px; font-weight:700;
    display:grid;place-items:center; font-family:var(--mono);
  }
  .mat-name{font-weight:600}
  .mat-note{color:var(--ink3); font-size:13.5px; margin-left:6px}

  /* ── 引用 ── */
  .cite{
    display:block; width:100%; text-align:left; background:transparent;
    border:0; border-left:2px solid var(--accent-line); padding:2px 0 2px 16px;
    margin-bottom:16px; cursor:pointer; font-family:var(--sans);
    transition:border-color .15s;
  }
  .cite:hover{border-left-color:var(--accent)}
  .cite-head{display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap}
  .cite-ref{
    font-family:var(--mono); font-size:11px; background:var(--accent-soft);
    color:var(--accent); border-radius:4px; padding:1px 6px; font-weight:600;
  }
  .cite-doc{font-size:13.5px; color:var(--ink2); font-weight:600}
  .cite-no{font-family:var(--mono); font-size:12px; color:var(--ink3)}
  .cite-quote{font-size:14px; color:var(--ink2); line-height:1.75; margin:0}
  .cite:hover .cite-doc{color:var(--accent)}

  /* ── 底部元信息 ── */
  .meta{
    display:flex; gap:18px; flex-wrap:wrap; align-items:center;
    font-size:12.5px; color:var(--ink3); padding:4px 2px;
  }
  .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--line2)}
  .conf-badge{
    font-size:11px; padding:1px 7px; border-radius:4px; font-weight:600;
    background:var(--accent-soft); color:var(--accent);
  }

  /* ── 加载骨架 ── */
  .skeleton{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:28px 30px}
  .sk-line{height:12px; border-radius:4px; background:linear-gradient(90deg,#f0ece5 25%,#f7f4ef 50%,#f0ece5 75%); background-size:200% 100%; animation:sh 1.3s infinite; margin-bottom:10px}
  .sk-line.w80{width:80%} .sk-line.w60{width:60%} .sk-line.w40{width:40%}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* ── 抽屉 ── */
  #scrim{position:fixed; inset:0; background:rgba(26,26,24,.28); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40}
  #scrim.open{opacity:1; pointer-events:auto}
  #drawer{
    position:fixed; top:0; right:0; height:100%; width:min(560px,92vw);
    background:var(--card); border-left:1px solid var(--line); z-index:50;
    transform:translateX(100%); transition:transform .26s cubic-bezier(.4,0,.2,1);
    display:flex; flex-direction:column;
  }
  #drawer.open{transform:translateX(0)}
  .drawer-head{padding:22px 26px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px}
  .drawer-head h2{font-family:var(--serif); font-size:17px; margin:0 0 4px; line-height:1.45}
  .drawer-sub{font-size:12.5px; color:var(--ink3); font-family:var(--mono)}
  .close{background:transparent;border:0;font-size:22px;line-height:1;color:var(--ink3);cursor:pointer;padding:0 4px}
  .close:hover{color:var(--ink)}
  .drawer-body{overflow-y:auto; padding:22px 26px 40px; flex:1}
  .sib{color:var(--ink3); font-size:14px; padding:12px 0; border-bottom:1px dashed var(--line)}
  .sib .no{font-family:var(--mono); font-size:11.5px; margin-right:8px}
  .sib.current{color:var(--ink); font-weight:500; border-left:2px solid var(--accent); padding-left:14px; margin-left:-14px}
  .drawer-link{display:inline-block; margin-top:18px; font-size:13.5px; color:var(--accent)}

  /* ── 空态 ── */
  .empty{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden; margin-top:44px;
  }
  .empty > div{background:var(--card); padding:22px 22px 24px}
  .empty .k{
    font-family:var(--serif); font-size:15px; font-weight:700; margin-bottom:8px;
    display:flex; align-items:center; gap:7px;
  }
  .empty .k::before{
    content:""; width:5px; height:5px; border-radius:50%; background:var(--accent);
    flex:0 0 auto;
  }
  .empty p{margin:0; font-size:13.5px; color:var(--ink2); line-height:1.7}
  .empty .num{font-family:var(--mono); color:var(--accent); font-weight:600}

  .foot{
    max-width:800px; margin:0 auto; padding:0 24px 40px;
    font-size:11.5px; color:var(--ink3); line-height:1.8;
  }
  .foot strong{color:var(--ink2); font-weight:600}
  @media (max-width:640px){
    .wrap{padding:32px 18px 28px}
    h1{font-size:28px}
    .card,.skeleton{padding:22px 20px}
    .conclusion{font-size:18.5px}
    .empty{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div class="brand-mark">沪</div>
    <div class="brand-text">上海人才与就业政策 · 可溯源问答</div>
  </div>

  <h1>问一句，给你能查证的答案</h1>
  <p class="lede">
    覆盖 <b>1301 份</b>市级政策文件、<b>7690 条</b>条款。每个结论都标注了出处，
    点开就能看到原文；查不到就明说查不到，<b>不编</b>。
  </p>

  <div class="ask">
    <textarea id="q" rows="2" placeholder="例如：应届毕业生落户需要什么条件？" autocomplete="off"></textarea>
    <div class="ask-row">
      <span class="hint"><kbd>Enter</kbd> 提问 · <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
      <button class="send" id="go">提问</button>
    </div>
  </div>

  <div class="examples" id="examples">
    <button class="chip">应届毕业生落户需要什么条件？</button>
    <button class="chip">租房补贴需要什么材料？</button>
    <button class="chip">居住证积分标准分值是多少？</button>
    <button class="chip">居转户要满几年？</button>
  </div>

  <div id="out"></div>
</div>

<div class="foot">
  <strong>非官方服务</strong> · 本页为个人学习作品，与上海市人力资源和社会保障局无隶属关系。
  内容基于公开政策文件自动整理，可能存在滞后或错漏，仅供参考，不构成办事依据，请以官方发布为准。
  数据抓取于 2026-11-16。
</div>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div>
      <h2 id="d-title">条款原文</h2>
      <div class="drawer-sub" id="d-sub"></div>
    </div>
    <button class="close" id="d-close" aria-label="关闭">×</button>
  </div>
  <div class="drawer-body" id="d-body"></div>
</aside>

<script>
const $ = (s) => document.querySelector(s);
const out = $("#out");
const ta = $("#q");

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

/* 把正文里的 [C1] 变成可点击的角标 */
function markCitations(text){
  return esc(text).replace(/\[C(\d+)\]/g,
    (_, n) => `<button class="cite-inline" data-ref="C${n}" title="查看出处">${n}</button>`);
}

function renderEmpty(){
  out.innerHTML = `<div class="empty">
    <div>
      <div class="k">能问什么</div>
      <p>人才引进、落户、居住证积分、就业与社保补贴、劳动关系。
         语料 <span class="num">1301</span> 份文件、<span class="num">7690</span> 条条款，抓取于 2026-11-16。</p>
    </div>
    <div>
      <div class="k">凭什么信</div>
      <p>每条结论都带引用角标，点开能看到条款原文和前后文。
         引文必须逐字来自原文，对不上就重试，仍对不上就拒答。</p>
    </div>
    <div>
      <div class="k">有多准</div>
      <p><span class="num">56</span> 题人工标注评测集：
         Recall@5 <span class="num">93.3%</span>，
         引用精确率 <span class="num">74.6%</span>，
         应拒答的题 <span class="num">100%</span> 拒掉。</p>
    </div>
  </div>`;
}

function skeleton(){
  out.innerHTML = `<div class="skeleton">
    <div class="sk-line w40"></div><div class="sk-line w80"></div>
    <div class="sk-line w80"></div><div class="sk-line w60"></div>
  </div>`;
}

function renderRefused(d){
  out.innerHTML = `
    <div class="card refused">
      <div class="eyebrow">未找到依据</div>
      <p class="conclusion">${esc(d.conclusion)}</p>
      <p style="margin:14px 0 0;color:var(--ink2);font-size:14.5px">
        现有 ${'1301'} 份政策文件里没有能直接回答这个问题的条款。
        可能是问题超出了收录范围（人才引进、落户、就业与社保补贴），
        也可能是这个说法本身在政策里不存在。
      </p>
    </div>
    <div class="meta">
      <span>耗时 ${d.latency_ms}ms</span><span class="dot"></span>
      <span>判定时点 ${esc(d.as_of)}</span>
    </div>`;
}

function renderAnswer(d){
  const parts = [];

  parts.push(`<div class="card">
    <div class="eyebrow">结论</div>
    <p class="conclusion">${markCitations(d.conclusion)}</p>
  </div>`);

  if (d.conflicts && d.conflicts.length){
    parts.push(`<div class="card conflict">
      <div class="eyebrow" style="color:#a33">资料之间存在不一致</div>
      <ul class="plain">${d.conflicts.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
    </div>`);
  }

  if (d.conditions && d.conditions.length){
    parts.push(`<div class="card">
      <section class="block" style="border:0;padding:0;margin:0">
        <h3>适用条件</h3>
        <ul class="plain">${d.conditions.map(c=>`<li>${markCitations(c)}</li>`).join("")}</ul>
      </section>
    </div>`);
  }

  if (d.materials && d.materials.length){
    parts.push(`<div class="card">
      <section class="block" style="border:0;padding:0;margin:0">
        <h3>所需材料</h3>
        <ul class="plain">${d.materials.map(m=>
          `<li><span class="mat-name">${markCitations(m.name)}</span>${
            m.note ? `<span class="mat-note">${markCitations(m.note)}</span>` : ""
          }</li>`).join("")}</ul>
      </section>
    </div>`);
  }

  if (d.process && d.process.length){
    parts.push(`<div class="card">
      <section class="block" style="border:0;padding:0;margin:0">
        <h3>办理步骤</h3>
        <ol class="plain">${d.process.map(p=>`<li>${markCitations(p)}</li>`).join("")}</ol>
      </section>
    </div>`);
  }

  if (d.citations && d.citations.length){
    parts.push(`<div class="card">
      <section class="block" style="border:0;padding:0;margin:0">
        <h3>依据条款 · 点击查看原文</h3>
        ${d.citations.map(c=>`
          <button class="cite" data-cid="${c.clause_id}">
            <div class="cite-head">
              <span class="cite-ref">${esc(c.ref)}</span>
              <span class="cite-doc">${esc(c.doc_title)}</span>
              <span class="cite-no">${esc(c.clause_no || "")}</span>
            </div>
            <p class="cite-quote">「${esc(c.quote)}」</p>
          </button>`).join("")}
      </section>
    </div>`);
  }

  const confMap = {high:"高", medium:"中", low:"低"};
  parts.push(`<div class="meta">
    <span class="conf-badge">把握度 ${confMap[d.confidence] || d.confidence}</span>
    <span class="dot"></span><span>耗时 ${d.latency_ms}ms</span>
    <span class="dot"></span><span>判定时点 ${esc(d.as_of)}</span>
  </div>`);

  out.innerHTML = parts.join("");
}

function renderError(msg){
  out.innerHTML = `<div class="card refused">
    <div class="eyebrow">出错了</div>
    <p class="conclusion" style="font-size:17px">${esc(msg)}</p>
    <p style="margin:12px 0 0;color:var(--ink2);font-size:14px">
      可能是后端服务或上游模型暂时不可用，稍等几秒再试。
    </p>
  </div>`;
}

async function ask(){
  const q = ta.value.trim();
  if (!q) { ta.focus(); return; }
  $("#go").disabled = true;
  $("#go").textContent = "检索中";
  skeleton();
  try{
    const r = await fetch("/api/ask", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({question:q})
    });
    if (!r.ok){
      const t = await r.text();
      renderError(`接口返回 ${r.status}${t ? "：" + t.slice(0,120) : ""}`);
      return;
    }
    const d = await r.json();
    d.refused ? renderRefused(d) : renderAnswer(d);
  }catch(e){
    renderError("网络请求失败：" + e.message);
  }finally{
    $("#go").disabled = false;
    $("#go").textContent = "提问";
  }
}

/* ── 抽屉：条款原文 ── */
async function openClause(id){
  $("#scrim").classList.add("open");
  $("#drawer").classList.add("open");
  $("#drawer").setAttribute("aria-hidden","false");
  $("#d-title").textContent = "加载中…";
  $("#d-sub").textContent = "";
  $("#d-body").innerHTML = "";
  try{
    const r = await fetch(`/api/clause/${id}`);
    if(!r.ok) throw new Error("条款读取失败 " + r.status);
    const d = await r.json();
    $("#d-title").textContent = d.doc_title;
    $("#d-sub").textContent = [d.doc_no, d.clause_no, d.effective_from ? "生效 " + d.effective_from : ""]
      .filter(Boolean).join(" · ");
    $("#d-body").innerHTML = `
      ${d.siblings.map(s => `
        <div class="sib ${s.id === d.clause_id ? "current" : ""}">
          <span class="no">${esc(s.clause_no || "")}</span>${esc(s.content)}
        </div>`).join("")}
      ${d.source_url ? `<a class="drawer-link" href="${esc(d.source_url)}" target="_blank" rel="noopener">
        ↗ 在官网查看原文</a>` : ""}
    `;
  }catch(e){
    $("#d-title").textContent = "读取失败";
    $("#d-body").innerHTML = `<p style="color:var(--ink2)">${esc(e.message)}</p>`;
  }
}

function closeDrawer(){
  $("#scrim").classList.remove("open");
  $("#drawer").classList.remove("open");
  $("#drawer").setAttribute("aria-hidden","true");
}

/* ── 事件 ── */
$("#go").addEventListener("click", ask);
ta.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask(); }
});
$("#examples").addEventListener("click", e => {
  if (e.target.classList.contains("chip")){
    ta.value = e.target.textContent;
    ask();
  }
});
document.addEventListener("click", e => {
  const cite = e.target.closest("[data-cid]");
  if (cite) { openClause(cite.dataset.cid); return; }
  const inline = e.target.closest(".cite-inline");
  if (inline){
    const ref = inline.dataset.ref;
    const card = out.querySelector(`.cite[data-cid]`);
    const all = [...out.querySelectorAll(".cite")];
    const idx = parseInt(ref.replace("C",""), 10) - 1;
    if (all[idx]) openClause(all[idx].dataset.cid);
  }
});
$("#d-close").addEventListener("click", closeDrawer);
$("#scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

renderEmpty();

(function(){
  const q = new URLSearchParams(location.search).get("q");
  if (q && q.trim()){
    ta.value = q.trim();
    ask();
  }
})();
</script>
