name: 政策增量更新

# 每周一 03:00 UTC（北京时间 11:00）自动跑一次
# 也可以在 Actions 页面手动点 Run workflow
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      pages:
        description: "每个栏目翻几页列表"
        default: "2"
        required: false

concurrency:
  group: policy-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # 这三个必须配在仓库 Secrets 里
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      # 可选：如果用的不是默认地址
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      EMBEDDING_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL }}
      PYTHONIOENCODING: utf-8
      # 输出目录统一放在仓库下，方便后续步骤引用
      CRAWL_OUT_DIR: ${{ github.workspace }}/crawl-out
      EVAL_OUT: ${{ github.workspace }}/eval

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # lxml 只在爬虫里用，不进服务端 requirements
          pip install lxml

      - name: 检查密钥
        run: |
          # 提前验证三个密钥。不查的话，密钥错要等 13 分钟评测跑完才发现，
          # 而且评测全挂时容易误判成检索坏了。
          python - <<'PY'
          import os, sys, httpx

          missing = [k for k in ("DATABASE_URL", "LLM_API_KEY", "EMBEDDING_API_KEY")
                     if not os.getenv(k)]
          if missing:
              print("✗ 缺少 Secrets:", ", ".join(missing)); sys.exit(1)
          print("✓ 三个 Secrets 都已配置")

          emb_base = os.getenv("EMBEDDING_BASE_URL") or "https://api.siliconflow.cn/v1"
          emb_key = os.environ["EMBEDDING_API_KEY"]
          try:
              r = httpx.post(f"{emb_base.rstrip('/')}/embeddings",
                             headers={"Authorization": f"Bearer {emb_key}"},
                             json={"model": "BAAI/bge-m3", "input": ["测试"]}, timeout=60)
              if r.status_code == 200:
                  print("✓ embedding 接口可用，维度", len(r.json()["data"][0]["embedding"]))
              else:
                  print(f"✗ embedding 接口返回 {r.status_code}: {r.text[:200]}"); sys.exit(1)
          except Exception as e:
              print(f"✗ embedding 接口不可达: {e}"); sys.exit(1)

          llm_base = os.getenv("LLM_BASE_URL") or "https://api.deepseek.com/v1"
          llm_key = os.environ["LLM_API_KEY"]
          try:
              r = httpx.post(f"{llm_base.rstrip('/')}/chat/completions",
                             headers={"Authorization": f"Bearer {llm_key}"},
                             json={"model": "deepseek-flash",
                                   "messages": [{"role": "user", "content": "hi"}],
                                   "max_tokens": 5}, timeout=90)
              if r.status_code == 200:
                  print("✓ 模型接口可用")
              else:
                  print(f"✗ 模型接口返回 {r.status_code}: {r.text[:200]}"); sys.exit(1)
          except Exception as e:
              print(f"✗ 模型接口不可达: {e}"); sys.exit(1)
          PY

      # ── 第一道守卫：robots 检查 ──
      - name: 抓取前置检查
        run: |
          echo "https://rsj.sh.gov.cn/tjypx_17737/20250310/t0035_1431083.html" > /tmp/urls.txt
          python scripts/crawl_preflight.py --urls /tmp/urls.txt

      # ── 抓取：只抓列表页发现的新文档 ──
      - name: 增量抓取
        id: crawl
        run: |
          set -o pipefail
          PAGES="${{ github.event.inputs.pages || '2' }}"
          python scripts/crawl_incremental.py --pages "$PAGES" | tee /tmp/crawl.log
          # 统计这次抓到几篇新文档
          NEW=$(python - <<'PY'
          import json, pathlib, os
          p = pathlib.Path(os.environ["CRAWL_OUT_DIR"]) / "crawl_result.json"
          print(len(json.loads(p.read_text(encoding="utf-8"))) if p.exists() else 0)
          PY
          )
          echo "new_docs=$NEW" >> "$GITHUB_OUTPUT"
          echo "本次抓到 $NEW 篇新文档"

      # ── 第二道守卫 + 变更记录 ──
      - name: 变更检测
        if: steps.crawl.outputs.new_docs != '0'
        run: |
          set -o pipefail
          python scripts/update_pipeline.py \
            --incoming "$CRAWL_OUT_DIR/crawl_result.json" \
            --incremental \
            --source rsj.sh.gov.cn | tee /tmp/detect.log

      # ── 切分 + 向量化 + 入库 ──
      - name: 新文档入库
        if: steps.crawl.outputs.new_docs != '0'
        run: |
          if [ -f "$CRAWL_OUT_DIR/new_docs.jsonl" ]; then
            python scripts/ingest_new_docs.py | tee /tmp/ingest.log
          else
            echo "没有 new_docs.jsonl，跳过"
          fi

      # ── 只有真的入库了新内容，才跑回归（省 API 额度）──
      - name: 跑评测并对比基线
        if: steps.crawl.outputs.new_docs != '0'
        run: |
          # pipefail 必须开。不加的话 `cmd | tee` 返回的是 tee 的退出码（永远 0），
          # 脚本失败会被吞掉——2026-11-19 那次就是这么显示绿勾、实际一道题都没测出来。
          set -o pipefail
          mkdir -p "$EVAL_OUT"
          python scripts/run_eval.py --temperature 0 --sleep 1.5 | tee /tmp/eval.log
          python scripts/run_regression.py | tee /tmp/regress.log

      - name: 汇总
        if: always()
        run: |
          {
            echo "## 政策增量更新结果"
            echo ""
            echo "| 项目 | 结果 |"
            echo "|---|---|"
            echo "| 新文档 | ${{ steps.crawl.outputs.new_docs }} 篇 |"
            echo "| 触发时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo ""
            if [ -f /tmp/crawl.log ]; then
              echo "### 抓取"
              echo '```'
              tail -n 25 /tmp/crawl.log
              echo '```'
            fi
            if [ -f /tmp/ingest.log ]; then
              echo "### 入库"
              echo '```'
              tail -n 15 /tmp/ingest.log
              echo '```'
            fi
            if [ -f /tmp/regress.log ]; then
              echo "### 回归对比"
              echo '```'
              tail -n 30 /tmp/regress.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
