services:
  - type: web
    name: policy-qa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"

      # 数据库（Supabase）。sync: false 表示值在 Render 控制台里填，不写进仓库
      - key: DATABASE_URL
        sync: false

      # 生成模型
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: deepseek-flash
      - key: LLM_MAX_TOKENS
        value: "8000"
      - key: LLM_TIMEOUT
        value: "90"

      # 向量模型
      - key: EMBEDDING_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: BAAI/bge-m3
      - key: EMBEDDING_DIM
        value: "1024"

      # 检索参数（和本地 .env 保持一致）
      - key: REFUSAL_THRESHOLD
        value: "0.45"
      - key: TOP_K_VECTOR
        value: "30"
      - key: TOP_K_KEYWORD
        value: "30"
      - key: TOP_K_FINAL
        value: "5"
      - key: CITATION_MIN_SIM
        value: "0.90"
